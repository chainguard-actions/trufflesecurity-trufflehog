name: Test TruffleHog - workflow_dispatch scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get HEAD commit for scanning
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          # Use HEAD~1 as base if available, otherwise use HEAD (will trigger same-commit error path)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD~1)
          else
            BASE=""
          fi
          echo "head=$HEAD" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT
      - name: Run TruffleHog action (workflow_dispatch event context)
        id: trufflehog
        uses: .
        with:
          path: ./
          base: ${{ steps.commits.outputs.base }}
          head: ${{ steps.commits.outputs.head }}
          extra_args: "--only-verified"
      - name: Assert scan completed without error
        run: |
          echo "TruffleHog scan completed successfully"
          echo "PASS"
