name: Test error when base and head are the same commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho "Mock docker called with args: $*" >&2\nexit 0\n' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Get current HEAD commit
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          echo "sha=$HEAD" >> "$GITHUB_OUTPUT"
          echo "SHA: $HEAD"
      - name: Run TruffleHog with same base and head (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          base: ${{ steps.commits.outputs.sha }}
          head: ${{ steps.commits.outputs.sha }}
      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when base and head are the same commit"
          else
            echo "FAIL: expected action to fail when base == head, but got outcome: $OUTCOME"
            exit 1
          fi
