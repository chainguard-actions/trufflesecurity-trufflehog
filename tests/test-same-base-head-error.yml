name: Test error when BASE and HEAD are the same commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run TruffleHog with same base and head (should fail before docker)
        id: action
        uses: .
        with:
          base: "HEAD"
          head: "HEAD"
        continue-on-error: true
      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when BASE == HEAD, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when BASE and HEAD are the same commit"
