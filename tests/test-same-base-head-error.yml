name: Test TruffleHog error when BASE equals HEAD
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get current HEAD commit SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current HEAD SHA: $SHA"
      - id: action
        uses: .
        with:
          path: "./"
          base: ${{ steps.get-sha.outputs.sha }}
          head: ${{ steps.get-sha.outputs.sha }}
        continue-on-error: true
      - name: Assert action failed with error (BASE == HEAD)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when BASE and HEAD are the same commit"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when BASE == HEAD but it succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
