name: Test TruffleHog - Error when base equals head
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get current HEAD SHA
        id: commits
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "HEAD SHA: $HEAD_SHA"

      - name: Run TruffleHog action with same base and head (should fail)
        id: action
        uses: .
        with:
          path: "./"
          base: ${{ steps.commits.outputs.sha }}
          head: ${{ steps.commits.outputs.sha }}
          version: "3.95.5"
        continue-on-error: true

      - name: Assert action failed with error for same base and head
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when base == head, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when base and head are the same commit"
