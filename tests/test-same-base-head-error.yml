name: Test error when base and head are the same commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get current HEAD SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current HEAD SHA: $SHA"
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: ${{ steps.sha.outputs.sha }}
          head: ${{ steps.sha.outputs.sha }}
      - name: Assert action failed with same base and head error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when base and head are the same commit"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when base == head"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
