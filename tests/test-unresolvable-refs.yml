name: Test identical unresolvable base and head refs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Confirm ref does not exist
        run: |
          if git rev-parse --verify --quiet does-not-exist-ref-aaa >/dev/null; then
            echo "FAIL: ref unexpectedly exists"
            exit 1
          fi
          echo "PASS: ref is unresolvable"
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: does-not-exist-ref-aaa
          head: does-not-exist-ref-aaa
      - name: Assert action failed (identical unresolvable refs treated as same commit)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when base and head are the same unresolvable ref"
            exit 1
          fi
          echo "PASS"
