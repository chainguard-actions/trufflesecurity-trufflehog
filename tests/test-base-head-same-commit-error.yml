name: Test TruffleHog base and head same commit error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get current HEAD SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "HEAD SHA: $SHA"
      - name: Run TruffleHog with same base and head SHA (should fail before docker)
        id: action
        uses: .
        with:
          base: ${{ steps.sha.outputs.sha }}
          head: ${{ steps.sha.outputs.sha }}
        continue-on-error: true
      - name: Assert action failed with same base and head
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when base and head are the same commit"
            exit 1
          fi
          echo "PASS: action correctly failed when base and head resolve to the same commit"
