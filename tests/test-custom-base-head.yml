name: Test custom base and head commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Get base and head commits
        id: get-commits
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # Try to get a parent commit; if only one commit exists, use HEAD for both
          # (we'll handle the same-commit case by using HEAD and HEAD itself won't work,
          # so we need at least 2 commits)
          PARENT_COUNT=$(git rev-list --count HEAD)
          if [ "$PARENT_COUNT" -ge 2 ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          else
            # Only one commit — skip this test gracefully
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only one commit in history, skipping base/head scan test"
            exit 0
          fi
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"
      - id: action
        if: steps.get-commits.outputs.skip != 'true'
        uses: .
        with:
          base: ${{ steps.get-commits.outputs.base }}
          head: ${{ steps.get-commits.outputs.head }}
          extra_args: "--only-verified"
        continue-on-error: true
      - name: Assert action ran with custom base and head
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SKIP: ${{ steps.get-commits.outputs.skip }}
        run: |
          echo "skip: $SKIP"
          echo "outcome: $OUTCOME"
          if [ "$SKIP" = "true" ]; then
            echo "PASS: skipped (only one commit in history)"
            exit 0
          fi
          # TruffleHog exits 0 if no verified secrets found.
          # We expect success (no real secrets in the harness repo).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: TruffleHog scan between base and head completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and exited (may have found issues or Docker unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
