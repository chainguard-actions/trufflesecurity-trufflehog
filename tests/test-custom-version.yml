name: Test TruffleHog with custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog with a specific version
        id: trufflehog
        uses: .
        with:
          path: ./
          version: "3.95.9"
          extra_args: "--only-verified"
        continue-on-error: true

      - name: Assert action ran with custom version
        env:
          OUTCOME: ${{ steps.trufflehog.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # success = no verified secrets found, failure = secrets found or docker error
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog ran with version 3.95.9"
          else
            echo "FAIL: Unexpected outcome: $OUTCOME"
            exit 1
          fi
