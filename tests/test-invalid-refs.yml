name: Test identical unresolvable BASE and HEAD refs error out
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker that records its arguments
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<EOF
          #!/bin/bash
          for a in "\$@"; do printf '%s\n' "\$a"; done > "$RUNNER_TEMP/docker-args"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      # Note: `git rev-parse <unknown>` echoes the unknown argument on stdout,
      # so two *different* unresolvable refs do not compare equal. Using the
      # same unresolvable ref for both makes base_commit == head_commit whether
      # rev-parse echoes the name or prints nothing, so the action must abort.
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: does-not-exist-ref-aaa
          head: does-not-exist-ref-aaa
      - name: Assert action failed before running docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when base and head are the same unresolvable ref"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/docker-args" ]; then
            echo "FAIL: docker should not have been invoked"
            cat "$RUNNER_TEMP/docker-args"
            exit 1
          fi
          echo "PASS"
