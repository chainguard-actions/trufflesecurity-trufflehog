name: Test base and head same commit (error case)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get current HEAD SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current HEAD SHA: $SHA"
      - name: Run TruffleHog with same base and head (should fail)
        id: action
        uses: .
        with:
          base: ${{ steps.get-sha.outputs.sha }}
          head: ${{ steps.get-sha.outputs.sha }}
        continue-on-error: true
      - name: Assert action failed with same base and head
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when base and head are the same commit"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when base == head"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
