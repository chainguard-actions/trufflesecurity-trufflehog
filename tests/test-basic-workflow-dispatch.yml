name: Test TruffleHog basic workflow_dispatch scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run TruffleHog on workflow_dispatch (full scan, only verified)
        id: action
        uses: .
        with:
          path: ./
          extra_args: "--only-verified"
        continue-on-error: true
      - name: Assert action did not error unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either succeeds (no verified secrets found) or fails (docker unavailable
          # or secrets found). We accept both success and failure here since docker availability
          # varies by environment. What we do NOT accept is a missing/skipped step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
