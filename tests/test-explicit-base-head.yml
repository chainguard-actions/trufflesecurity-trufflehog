name: Test TruffleHog with explicit base and head commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Get base and head commits for scanning
        id: get-commits
        run: |
          # Get the last two commits so we have a valid range
          HEAD_SHA=$(git rev-parse HEAD)
          # Try to get parent commit; if only one commit, use empty string for base
          BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "HEAD SHA: $HEAD_SHA"
          echo "BASE SHA: $BASE_SHA"
      - id: action
        uses: .
        with:
          path: "./"
          base: ${{ steps.get-commits.outputs.base }}
          head: ${{ steps.get-commits.outputs.head }}
          extra_args: "--only-verified"
        continue-on-error: true
      - name: Assert action ran with explicit base/head
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BASE: ${{ steps.get-commits.outputs.base }}
          HEAD: ${{ steps.get-commits.outputs.head }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base: $BASE"
          echo "head: $HEAD"
          # The action should either succeed (no secrets found) or fail (secrets found).
          # Both are valid outcomes for the scan itself running correctly.
          # What we do NOT want is an unexpected error (e.g. BASE==HEAD error when they differ).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: TruffleHog scan completed successfully between base and head"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog scan ran and exited (may have found issues or env limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
