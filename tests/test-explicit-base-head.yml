name: Test explicit base and head inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure at least two commits exist for base/head scan
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -lt 2 ]; then
            echo "Creating an empty commit for testing..."
            git config user.email "test@example.com"
            git config user.name "Test User"
            git commit --allow-empty -m "Test commit for base/head scanning"
          fi
      - name: Install mock docker that simulates a clean TruffleHog scan
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/sh' \
            '# Mock docker: intercept trufflehog image runs and exit 0 (no secrets found)' \
            'case "$*" in' \
            '  *trufflehog*)' \
            '    echo "TruffleHog scan complete. No verified secrets found." >&2' \
            '    exit 0' \
            '    ;;' \
            '  *pull*)' \
            '    echo "Mock: skipping pull" >&2' \
            '    exit 0' \
            '    ;;' \
            '  *info*)' \
            '    echo "{\"ServerVersion\":\"mock\"}"' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'if command -v /usr/bin/docker > /dev/null 2>&1; then' \
            '  exec /usr/bin/docker "$@"' \
            'fi' \
            'exit 0' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run TruffleHog with explicit base and head
        id: action
        uses: .
        with:
          base: "HEAD~1"
          head: "HEAD"
          extra_args: "--only-verified"
      - name: Assert action completed successfully
        run: |
          echo "PASS: TruffleHog scan with explicit base/head completed successfully"
