name: Test path that is not a git repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a non-git directory outside the workspace repo
        run: |
          mkdir -p /tmp/not-a-repo
          echo "hello" > /tmp/not-a-repo/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/not-a-repo
          base: main
          head: HEAD
      - name: Assert action failed on git status
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when path is not a git repository"
            exit 1
          fi
          echo "PASS"
