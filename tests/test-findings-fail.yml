name: Test findings propagate failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker that simulates findings (exit 183)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$@" > "$RUNNER_TEMP/docker-args.txt"
          echo "Found verified result"
          exit 183
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - name: Create scan repo
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/scan-repo"
          cd "$GITHUB_WORKSPACE/scan-repo"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo one > a.txt
          git add a.txt
          git commit -q -m one
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: scan-repo
      - name: Assert action failed after invoking docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f "$RUNNER_TEMP/docker-args.txt" ]; then
            echo "FAIL: docker was not invoked"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when scanner reports findings"
            exit 1
          fi
          echo "PASS"
