name: Test error when BASE and HEAD are the same commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install mock docker to avoid Docker-in-Docker requirement
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/docker << 'EOF'
          #!/bin/sh
          # Mock docker: simulate a successful TruffleHog scan (no secrets found)
          echo "[mock docker] called with args: $*" >&2
          exit 0
          EOF
          chmod +x /tmp/mock-bin/docker
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - name: Run TruffleHog action with same BASE and HEAD (should fail)
        id: action
        uses: .
        with:
          base: "HEAD"
          head: "HEAD"
          extra_args: "--only-verified"
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when BASE and HEAD are the same commit, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when BASE == HEAD"
