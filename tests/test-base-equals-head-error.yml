name: Test error when BASE equals HEAD
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho "MOCK DOCKER CALLED: $*" >&2\nexit 0\n' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run TruffleHog action with BASE == HEAD (should fail)
        id: action
        uses: .
        with:
          base: "HEAD"
          head: "HEAD"
        continue-on-error: true

      - name: Assert action failed when BASE equals HEAD
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when BASE == HEAD, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when BASE == HEAD"
