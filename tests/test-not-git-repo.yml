name: Test non-git path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker and create non-git dir
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$@" > "$RUNNER_TEMP/docker-args.txt"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -rf /tmp/trufflehog-not-a-git-repo
          mkdir -p /tmp/trufflehog-not-a-git-repo
          echo hello > /tmp/trufflehog-not-a-git-repo/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/trufflehog-not-a-git-repo
      - name: Assert action failed and docker was not called
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-git path"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/docker-args.txt" ]; then
            echo "FAIL: docker should not have been invoked"
            exit 1
          fi
          echo "PASS"
