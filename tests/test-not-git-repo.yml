name: Test path that is not a git repository errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a non-git directory outside the workspace
        run: |
          rm -rf /tmp/not-a-git-repo
          mkdir -p /tmp/not-a-git-repo
          echo "hello" > /tmp/not-a-git-repo/file.txt
          if git -C /tmp/not-a-git-repo rev-parse --git-dir >/dev/null 2>&1; then
            echo "SETUP ERROR: /tmp/not-a-git-repo is unexpectedly inside a git repo"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/not-a-git-repo
          base: main
          head: HEAD
      - name: Assert action failed on non-git path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when path is not a git repository"
            exit 1
          fi
          echo "PASS"
