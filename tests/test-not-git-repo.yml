name: Test non-git path errors out
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare non-git dir and fake docker
        run: |
          mkdir -p /tmp/not-a-git-repo
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<EOF
          #!/bin/bash
          for a in "\$@"; do printf '%s\n' "\$a"; done > "$RUNNER_TEMP/docker-args"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/not-a-git-repo
      - name: Assert action failed before running docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outside a git repository"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/docker-args" ]; then
            echo "FAIL: docker should not have been invoked"
            exit 1
          fi
          echo "PASS"
