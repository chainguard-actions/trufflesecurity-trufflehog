name: Test non-git path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare non-git directory and fake docker
        run: |
          rm -rf /tmp/not-a-repo
          mkdir -p /tmp/not-a-repo
          echo hello > /tmp/not-a-repo/file.txt
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo called > /tmp/docker-called
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          rm -f /tmp/docker-called
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GIT_CEILING_DIRECTORIES: /tmp
        with:
          path: /tmp/not-a-repo
      - name: Assert action failed without running docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-git path"
            exit 1
          fi
          if [ -f /tmp/docker-called ]; then
            echo "FAIL: docker should not have been invoked"
            exit 1
          fi
          echo "PASS"
