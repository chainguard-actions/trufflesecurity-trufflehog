name: Test path that is not a git repository errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create non-git directory outside the workspace
        run: |
          rm -rf /tmp/not-a-repo
          mkdir -p /tmp/not-a-repo
          echo "hello" > /tmp/not-a-repo/file.txt
      - id: action
        uses: .
        continue-on-error: true
        env:
          GIT_CEILING_DIRECTORIES: /tmp
        with:
          path: /tmp/not-a-repo
          base: HEAD~1
          head: HEAD
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-git path"
            exit 1
          fi
          echo "PASS"
