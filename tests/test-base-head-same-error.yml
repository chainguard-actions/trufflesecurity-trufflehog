name: Test error when BASE and HEAD are the same commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get current HEAD SHA for use as base and head
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current HEAD SHA: $SHA"
      - name: Run TruffleHog action with same BASE and HEAD SHA (should fail)
        id: action
        uses: .
        with:
          base: ${{ steps.get-sha.outputs.sha }}
          head: ${{ steps.get-sha.outputs.sha }}
        continue-on-error: true
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when BASE == HEAD, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when BASE and HEAD are the same commit"
