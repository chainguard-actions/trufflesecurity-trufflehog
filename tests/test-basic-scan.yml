name: Test TruffleHog basic scan (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan (workflow_dispatch mode, only-verified)
        id: action
        uses: .
        with:
          path: "./"
          extra_args: "--only-verified"
        continue-on-error: true

      - name: Assert scan completed (pass or no verified secrets found)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch with --only-verified, TruffleHog should either
          # succeed (no verified secrets) or fail gracefully (verified secrets found).
          # Both outcomes mean the action ran correctly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: TruffleHog scan completed with no verified secrets found"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog scan ran and reported verified secrets (action behaved correctly)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
