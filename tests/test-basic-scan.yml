name: Test basic scan (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan (workflow_dispatch - full repo)
        id: action
        uses: .
        with:
          extra_args: "--only-verified"
        continue-on-error: true

      - name: Assert scan completed (success or no verified secrets found)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: TruffleHog scan completed successfully (no verified secrets found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog ran and reported an outcome (may have found issues or Docker unavailable)"
            echo "NOTE: This is acceptable in the harness environment"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
