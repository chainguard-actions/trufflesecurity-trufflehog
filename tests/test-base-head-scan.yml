name: Test base/head commit range scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install mock docker to avoid pulling real image
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/sh' \
            '# Fake docker: simulate TruffleHog finding no secrets (exit 0)' \
            'echo "TruffleHog OSS (mock)"' \
            'echo "No secrets detected."' \
            'exit 0' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Get commit SHAs for base and head
        id: commits
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # Use HEAD~1 as base if it exists, otherwise use an empty tree SHA
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            BASE_SHA=$(git rev-parse HEAD~1)
          else
            # Only one commit — use the empty tree as base
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

      - name: Run TruffleHog action with base/head range
        id: action
        uses: .
        with:
          base: ${{ steps.commits.outputs.base }}
          head: ${{ steps.commits.outputs.head }}
          extra_args: "--only-verified"

      - name: Assert action completed successfully
        run: |
          echo "PASS: TruffleHog scanned commit range without finding verified secrets"
