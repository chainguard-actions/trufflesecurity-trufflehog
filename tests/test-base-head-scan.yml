name: Test scan with explicit base and head commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Get base and head commits
        id: get-commits
        run: |
          # Get the last two commits for base/head scanning
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Total commits: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -ge 2 ]; then
            BASE=$(git rev-parse HEAD~1)
            HEAD_SHA=$(git rev-parse HEAD)
          else
            # Only one commit — use empty string for base (scan from beginning)
            BASE=""
            HEAD_SHA=$(git rev-parse HEAD)
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE"
          echo "Head: $HEAD_SHA"

      - id: scan
        name: Run TruffleHog with explicit base and head
        uses: .
        with:
          path: ./
          base: ${{ steps.get-commits.outputs.base }}
          head: ${{ steps.get-commits.outputs.head }}
          extra_args: "--only-verified"
        continue-on-error: true

      - name: Assert scan ran with base/head inputs
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # TruffleHog exits 0 when no verified secrets found.
          # We expect success (no real secrets in test repo).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: TruffleHog scan with base/head completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog ran and exited (Docker or scan result)"
            echo "NOTE: Acceptable in harness environment"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
