name: Test scan with explicit base and head
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker that records its arguments
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          printf '%s\n' "$@" > /tmp/docker-args
          pwd > /tmp/docker-pwd
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          rm -f /tmp/docker-args /tmp/docker-pwd
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - name: Create a scan repository with two commits
        id: repo
        run: |
          rm -rf "$GITHUB_WORKSPACE/scan-repo"
          mkdir -p "$GITHUB_WORKSPACE/scan-repo"
          cd "$GITHUB_WORKSPACE/scan-repo"
          git init -q .
          echo one > a.txt
          git add a.txt
          git -c user.email=t@example.com -c user.name=T commit -q -m one
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo two > b.txt
          git add b.txt
          git -c user.email=t@example.com -c user.name=T commit -q -m two
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          path: scan-repo
          base: ${{ steps.repo.outputs.base }}
          head: ${{ steps.repo.outputs.head }}
          version: 3.0.0
          image: registry.example.com/mirror/trufflehog
          extra_args: --results=verified
      - name: Assert docker invoked with expected arguments
        env:
          BASE: ${{ steps.repo.outputs.base }}
          HEAD_SHA: ${{ steps.repo.outputs.head }}
        run: |
          if [ ! -f /tmp/docker-args ]; then
            echo "FAIL: docker was not invoked"
            exit 1
          fi
          echo "--- docker args ---"
          cat /tmp/docker-args
          echo "--- docker pwd ---"
          cat /tmp/docker-pwd
          fail=0
          for want in run --rm "registry.example.com/mirror/trufflehog:3.0.0" git "file:///tmp/" \
                      --since-commit "$BASE" --branch "$HEAD_SHA" --fail --no-update \
                      --github-actions --results=verified; do
            if ! grep -qxF -- "$want" /tmp/docker-args; then
              echo "FAIL: missing argument '$want'"
              fail=1
            fi
          done
          after_since=$(grep -A1 -xF -- --since-commit /tmp/docker-args | tail -n1)
          after_branch=$(grep -A1 -xF -- --branch /tmp/docker-args | tail -n1)
          if [ "$after_since" != "$BASE" ]; then
            echo "FAIL: --since-commit value '$after_since' != '$BASE'"; fail=1
          fi
          if [ "$after_branch" != "$HEAD_SHA" ]; then
            echo "FAIL: --branch value '$after_branch' != '$HEAD_SHA'"; fail=1
          fi
          case "$(cat /tmp/docker-pwd)" in
            */scan-repo) ;;
            *) echo "FAIL: docker not run from scan-repo working directory"; fail=1 ;;
          esac
          [ "$fail" = 0 ] || exit 1
          echo "PASS"
