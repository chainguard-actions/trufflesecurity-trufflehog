name: Test extra_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho "Mock docker called with args: $*" >&2\nexit 0\n' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run TruffleHog with extra args (only-verified and json output)
        id: action
        uses: .
        with:
          extra_args: "--only-verified --json"
      - name: Assert action completed successfully with extra args
        run: |
          echo "PASS: TruffleHog scan completed with extra_args (--only-verified --json)"
