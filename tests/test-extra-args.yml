name: Test extra_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install mock docker and capture args
        run: |
          mkdir -p /tmp/mock-bin
          printf '%s\n' '#!/bin/sh' \
            'echo "mock docker called with: $*"' \
            'case "$*" in' \
            '  *trufflehog*)' \
            '    echo "$*" > /tmp/docker-args-captured.txt' \
            '    echo "Mock TruffleHog: scan complete, no secrets found."' \
            '    exit 0' \
            '    ;;' \
            '  *)' \
            '    exit 0' \
            '    ;;' \
            'esac' > /tmp/mock-bin/docker
          chmod +x /tmp/mock-bin/docker
          echo "/tmp/mock-bin" >> $GITHUB_PATH
      - name: Run TruffleHog action with extra_args
        id: action
        uses: .
        with:
          version: "latest"
          extra_args: "--only-verified"
      - name: Assert action completed and extra_args were passed
        run: |
          echo "Checking captured docker args..."
          if [ -f /tmp/docker-args-captured.txt ]; then
            CAPTURED=$(cat /tmp/docker-args-captured.txt)
            echo "Captured args: $CAPTURED"
            if echo "$CAPTURED" | grep -q -- "--only-verified"; then
              echo "PASS: --only-verified flag was passed to TruffleHog"
            else
              echo "FAIL: --only-verified flag was not found in docker args"
              exit 1
            fi
          else
            echo "FAIL: docker was not called (args file not found)"
            exit 1
          fi
