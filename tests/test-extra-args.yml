name: Test extra_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: "./"
          extra_args: "--only-verified --json"
          version: "latest"
      - name: Assert scan ran with extra_args
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run with the extra args passed through
          # Success or failure both indicate the action ran (not a setup error)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog ran with extra_args (--only-verified --json)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
