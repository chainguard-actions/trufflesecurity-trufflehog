name: Test extra_args input passthrough
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        name: Run TruffleHog with extra_args (--only-verified --json)
        uses: .
        with:
          path: ./
          extra_args: "--only-verified --json"
        continue-on-error: true

      - name: Assert scan ran with extra args
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept extra_args and pass them to TruffleHog.
          # Success means no verified secrets found; failure means Docker/scan issue.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: TruffleHog accepted extra_args and completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog ran (Docker or scan result in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
