name: Test basic usage (workflow_dispatch, full repo scan)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install fake docker to avoid Docker-in-Docker issues
        run: |
          mkdir -p /tmp/fake-bin
          printf '#!/bin/sh\n# Fake docker: simulate trufflehog finding no secrets\nexit 0\n' > /tmp/fake-bin/docker
          chmod +x /tmp/fake-bin/docker
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
      - name: Run TruffleHog action (workflow_dispatch - full repo scan)
        id: action
        uses: .
        with:
          path: "./"
          extra_args: "--only-verified"
      - name: Assert action completed successfully
        run: |
          echo "PASS: TruffleHog action completed without finding verified secrets"
