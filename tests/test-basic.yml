name: Test basic usage (workflow_dispatch full scan)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install mock docker to avoid pulling real image
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/sh' \
            '# Fake docker: simulate TruffleHog finding no secrets (exit 0)' \
            'echo "TruffleHog OSS (mock)"' \
            'echo "No secrets detected."' \
            'exit 0' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run TruffleHog action (workflow_dispatch - full scan)
        id: action
        uses: .
        with:
          extra_args: "--only-verified"

      - name: Assert action completed successfully
        run: |
          echo "PASS: TruffleHog scan completed without finding verified secrets"
