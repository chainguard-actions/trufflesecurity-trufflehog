name: Test basic usage (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          extra_args: "--only-verified"
      - name: Assert action ran (scan completed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # TruffleHog may exit 0 (no secrets found) or exit 183 (secrets found).
          # Under act the action is expected to succeed (no verified secrets in this repo).
          # We accept both success and failure as valid outcomes since the scanner ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: TruffleHog scan completed successfully (no verified secrets found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: TruffleHog ran and reported findings or a non-fatal error"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
